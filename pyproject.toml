[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MEA-Absorption-Column"
version = "0.1.0"
description = "A Python based MEA Absorption Column model"
readme = "README.md"
license = {text = "MIT"}
authors = [{ name = "Tanner Polley", email = "tannerwpolley@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "scipy>=1.11",
]

[dependency-groups]
test = [
    "pytest>=8.0",
]
dev = [
    { include-group = "test" },
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mea_absorption_column = ["data/*.csv", "data/epcsaft_neutral/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
testpaths = ["tests"]
