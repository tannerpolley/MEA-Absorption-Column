name: Milestone sections

# One-shot: applies the standing-section milestone plan when this file lands on
# main. Safe to rerun; delete this file once the run succeeds.
on:
  push:
    branches: [main]
    paths: [.github/workflows/milestone-sections.yml]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Apply sections
        run: |
          set -euo pipefail
          number() { gh api "repos/$GH_REPO/milestones?state=all&per_page=100" --jq ".[] | select(.title == \"$1\") | .number"; }
          # section <title> <old title or -> <description>: rename or create, and keep open
          section() {
            n=$(number "$1"); [ -n "$n" ] || n=$(number "$2")
            if [ -n "$n" ]; then gh api -X PATCH "repos/$GH_REPO/milestones/$n" -f title="$1" -f state=open -f description="$3" >/dev/null
            else gh api "repos/$GH_REPO/milestones" -f title="$1" -f description="$3" >/dev/null; fi
            echo "section: $1"
          }
          move() { gh issue edit "$1" --milestone "$2" >/dev/null; echo "#$1 -> $2"; }
          section "Engine Integration" "01 - Current Engine Integration" "Connecting the absorber to the immutable thermodynamic Engine wheel: integration/, src/mea_absorption_column/Thermodynamics, the check scripts, the eNRTL packet, legacy adapters, and retired Engine names. Excludes solver numerics and film physics."
          section "Column Solver" "02 - CasADi Column Solver Migration" "CasADi/IPOPT column solving: src/mea_absorption_column/BVP, column.py, continuation.py, initialization, scaling, exact derivatives, evaluation cost, and the BVP analyses. Excludes thermodynamics and film closures."
          section "Film and Transport Physics" "Research - Configurable Physics" "Reactive-film closures, mass and heat transfer, and solvent contracts: src/mea_absorption_column/Transport, Properties, research.py, and the reactive-film and transport-sensitivity analyses. Exploratory; not an Engine acceptance gate."
          section "Validation and Calibration" - "Checking and tuning against pilot data: analyses/nccc_validation, physical_acceptance_149, calibration.py, uq.py, and the benchmarks. Excludes model and solver changes."
          section "Manuscript" - "Paper, reviewer responses, and reproducibility: the reviewer and revision files in docs/, analyses/manuscript.py, REPRODUCE.md."
          section "Tooling" "Tooling - Research Infrastructure" "Repo hygiene and research tooling: the Zotero project library and Companion knowledge base, scripts/, .github, pyproject.toml, and agent docs. Excludes model, method, and analysis work."
          move 69 "Engine Integration"
          move 71 "Engine Integration"
          gh api "repos/$GH_REPO/milestones?state=all&per_page=100" --jq '.[] | "\(.state)\t\(.open_issues) open\t\(.title)"'
