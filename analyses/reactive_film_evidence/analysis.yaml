id: reactive_film_evidence
title: Physical inputs and observations for reactive-film development
status: active
summary: Source availability, finite-rate kinetics, transport quantities, and aggregate film-model comparison evidence.
owner: project
inputs:
  - path: inputs/source_data_availability.csv
    kind: source_availability_matrix
  - path: ../nccc_validation/results/final/tables/issue34_rate_observation_comparisons.csv
    kind: retained_putta2016_table4_aggregate_aard
  - path: ../nccc_validation/results/final/tables/issue35_transport_correlations.csv
    kind: retained_transport_correlations
  - path: ../nccc_validation/results/final/tables/issue41_source_rate_evidence.csv
    kind: retained_finite_rate_kinetics
  - path: ../nccc_validation/results/final/tables/issue42_transport_inputs.csv
    kind: retained_species_transport_inventory
  - path: inputs/dugas2011_table1_mea.csv
    kind: exact_local_film_observations
  - path: inputs/diffusion_anchor_assumptions.csv
    kind: labeled_diffusion_anchors_and_assumptions
  - path: inputs/ramezani2021_si_rows.csv
    kind: exact_supplied_si_rows
  - path: inputs/ganesan2026_si_rows.csv
    kind: exact_supplied_si_rows
  - path: inputs/ganesan2026_si_model_choices.csv
    kind: exact_supplied_si_model_choices
outputs:
  - path: results/final/tables/column_film_capture_comparison.csv
    kind: eight_case_enhancement_and_reactive_film_capture_comparison
  - path: results/final/tables/column_film_nodes.csv
    kind: retained_outer_iteration_film_node_diagnostics
  - path: results/final/tables/column_film_axial_profiles.csv
    kind: retained_final_column_profiles
  - path: results/final/tables/column_film_run_provenance.json
    kind: reactive_film_campaign_provenance
  - path: results/final/figures/column_film_capture_comparison.png
    kind: campaign_capture_comparison_figure
  - path: results/final/figures/column_film_capture_comparison.pdf
    kind: campaign_capture_comparison_figure
  - path: results/final/tables/column_film_temperature_metrics.csv
    kind: six_case_liquid_temperature_tap_metrics
  - path: results/final/figures/column_film_temperature_overlay.png
    kind: six_case_reactive_film_temperature_figure
  - path: results/final/figures/column_film_temperature_overlay.pdf
    kind: six_case_reactive_film_temperature_figure
  - path: results/final/figures/column_film_3c_temperature.png
    kind: case_3c_reactive_film_temperature_figure
  - path: results/final/figures/column_film_3c_temperature.pdf
    kind: case_3c_reactive_film_temperature_figure
  - path: results/final/tables/putta2016_table4_aard_plot.csv
    kind: exact_plot_data
  - path: results/final/tables/chemical_potential_isolation_plot.csv
    kind: exact_plot_data_non_predictive
  - path: results/final/tables/chemical_potential_definition_trace.csv
    kind: exact_diagnostic_trace_non_predictive
  - path: results/final/tables/diffusion_anchor_plot.csv
    kind: exact_plot_data_non_predictive
  - path: results/final/tables/dugas2011_table1_mea_plot.csv
    kind: exact_plot_data
  - path: results/final/tables/ramezani_viscosity_sensitivity_plot.csv
    kind: exact_plot_data_non_predictive
  - path: results/final/tables/ganesan2026_si_rows_plot.csv
    kind: exact_plot_data
  - path: results/final/tables/ganesan2026_si_model_choices_plot.csv
    kind: exact_plot_data
  - path: results/final/figures/putta2016_table4_aard.png
    kind: aggregate_model_comparison_figure
  - path: results/final/figures/putta2016_table4_aard.pdf
    kind: aggregate_model_comparison_figure
  - path: results/final/figures/reactive_film_evidence_panels.png
    kind: three_panel_non_validation_evidence_figure
  - path: results/final/figures/reactive_film_evidence_panels.pdf
    kind: three_panel_non_validation_evidence_figure
commands:
  generate:
    - OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 uv run python analyses/reactive_film_evidence/scripts/build_reactive_film_evidence.py
  render:
    - uv run python analyses/reactive_film_evidence/scripts/promote_column_film_results.py
    - uv run python analyses/reactive_film_evidence/scripts/render_column_film_comparison.py
    - uv run python analyses/reactive_film_evidence/scripts/render_reactive_film_evidence.py
    - uv run python analyses/reactive_film_evidence/scripts/render_putta2016_aard.py
claim_boundary: The eight-case column campaign reports numerical predictions from the adopted nine-species equilibrium-manifold film formulation and compares them with the former enhancement-factor closure and observations; the diagonal pair-mobility closure uses estimated species diffusivities rather than a measured nine-species Maxwell-Stefan matrix, so the campaign is predictive with respect to fixed documented inputs but is not independently validated transport physics or a fitted capture correlation.
