id: nccc_validation
title: NCCC MEA Absorber Validation And Thermodynamic Benchmark
status: active
summary: Reviewer-response validation artifacts for one-bed C cases, SRP-style method contrast, ideal Henry versus routine ePC-SAFT fugacity driving-force comparisons, and diagnostic activity-coupled ePC-SAFT option checks.
owner: project
architecture:
  standard: local_codex_project_architecture
  role: self_contained_analysis
  disposable_outputs: results/runs
  curated_outputs: results/final
inputs:
  - path: ../../src/mea_absorption_column/data/C_cases_data.csv
    kind: packaged_reference_data
  - path: ../../src/mea_absorption_column/data/NCCC_Data.csv
    kind: packaged_reference_data
outputs:
  - path: results/final/tables/verified_c_case_thermo_benchmark.csv
    kind: accepted_result_table
  - path: results/final/tables/validation_evidence_registry.csv
    kind: evidence_registry
  - path: results/final/tables/primary_validation_gate.csv
    kind: validation_gate_table
  - path: results/final/tables/calibration_holdout_metrics.csv
    kind: calibration_screen_table
  - path: results/final/tables/error_regime_capture_data.csv
    kind: plot_data_table
  - path: results/final/tables/uncertainty_band_capture.csv
    kind: uncertainty_screen_table
  - path: results/final/tables/method_case_contrast.csv
    kind: solver_method_diagnostic_table
  - path: results/final/tables/epcsaft_electrolyte_option_matrix.csv
    kind: electrolyte_option_diagnostic_table
  - path: results/final/reports/epcsaft_electrolyte_option_matrix.md
    kind: electrolyte_option_diagnostic_report
  - path: results/final/tables/epcsaft_electrolyte_column_config_matrix.csv
    kind: electrolyte_column_configuration_table
  - path: results/final/tables/epcsaft_electrolyte_config_user_options.csv
    kind: electrolyte_configuration_source_table
  - path: results/final/tables/epcsaft_electrolyte_pure_parameters.csv
    kind: electrolyte_pure_parameter_provenance_table
  - path: results/final/tables/epcsaft_electrolyte_binary_parameters.csv
    kind: electrolyte_binary_parameter_provenance_table
  - path: results/final/tables/epcsaft_electrolyte_relative_permittivity_parameters.csv
    kind: electrolyte_relative_permittivity_parameter_table
  - path: results/final/tables/full_species_ionic_2017_c_case_sweep.csv
    kind: activity_coupled_feasibility_table
  - path: results/final/reports/epcsaft_electrolyte_column_config_matrix.md
    kind: electrolyte_column_configuration_report
  - path: results/final/figures/c_case_thermo_benchmark.pdf
    kind: manuscript_figure
  - path: results/final/figures/error_regime_capture_error.pdf
    kind: manuscript_figure
  - path: results/final/figures/calibration_uncertainty_band.pdf
    kind: manuscript_figure
  - path: results/final/figures/method_case_solver_contrast.pdf
    kind: manuscript_figure
  - path: results/final/profiles
    kind: clean_profile_gallery
  - path: results/runs/*/profiles
    kind: requested_dense_profile_csvs
commands:
  generate:
    - .\.venv\Scripts\python.exe analyses\nccc_validation\scripts\generate_data.py
  render:
    - .\.venv\Scripts\python.exe analyses\nccc_validation\scripts\render_figures.py
  profiles:
    - .\.venv\Scripts\python.exe analyses\nccc_validation\scripts\collect_clean_profiles.py --collect-existing
  case_profile:
    - .\.venv\Scripts\python.exe analyses\nccc_validation\scripts\run_case_profile.py --case-source C_cases_data --case-id 3C --method scipy-bvp --thermo-model ideal_henry --output-dir analyses\nccc_validation\results\runs\manual_case_profiles
  clean_profile_csvs:
    - .\.venv\Scripts\python.exe analyses\nccc_validation\scripts\generate_clean_profile_csvs.py --suite all --output-dir analyses\nccc_validation\results\runs\clean_profile_csvs
  validate:
    - .\.venv\Scripts\python.exe analyses\nccc_validation\scripts\validate_results.py
  epcsaft_electrolyte_options:
    - .\.venv\Scripts\python.exe analyses\nccc_validation\scripts\probe_epcsaft_electrolyte_options.py
  epcsaft_electrolyte_column_matrix:
    - .\.venv\Scripts\python.exe analyses\nccc_validation\scripts\run_epcsaft_electrolyte_config_matrix.py
runtime:
  quick_seconds: 10
  full_seconds: 600
external_dependencies:
  epcsaft:
    required_for:
      - thermo_model: epcsaft_ionic
      - thermo_model: epcsaft_reactive_six
      - thermo_model: epcsaft_reactive_six_concentration
      - thermo_model: epcsaft_reactive_six_activity
      - script: scripts/probe_reactive_epcsaft_speciation.py
      - script: scripts/probe_epcsaft_electrolyte_options.py
      - script: scripts/run_epcsaft_electrolyte_config_matrix.py
    not_required_for:
      - thermo_model: ideal_henry
      - script: scripts/generate_data.py
      - script: scripts/render_figures.py
      - script: scripts/validate_results.py
    package_contract: external package is read-only from this repo; adapter, caching, guards, and benchmark scripts live here
    optional_env:
      MEA_EPCSAFT_ROOT: /path/to/ePC-SAFT
      MEA_EPCSAFT_DATASET_NAME: MEA_CO2_H2O_ionic_fit
    repo_owned_datasets:
      - ../../src/mea_absorption_column/data/epcsaft_datasets/MEA_CO2_H2O_draft
      - ../../src/mea_absorption_column/data/epcsaft_datasets/MEA_CO2_H2O_ionic_fit
      - ../../src/mea_absorption_column/data/epcsaft_datasets/MEA_CO2_H2O_neutral_legacy
tracked_results:
  - results/final/tables
  - results/final/figures
  - results/final/profiles
