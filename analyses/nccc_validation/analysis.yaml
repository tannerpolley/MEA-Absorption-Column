id: nccc_validation
title: NCCC MEA Absorber Validation And Thermodynamic Benchmark
status: active
summary: Reviewer-response validation evidence for one-bed NCCC cases, solver-method contrast, ideal Henry versus routine ePC-SAFT fugacity driving-force comparisons, and bounded ePC-SAFT 0.2 fixed-chemistry checks.
owner: project
architecture:
  standard: local_codex_project_architecture
  role: self_contained_analysis
  disposable_outputs: results/runs
  curated_outputs: results/final
inputs:
  - path: ../../src/mea_absorption_column/data/C_cases_data.csv
    kind: packaged_reference_data
  - path: ../../src/mea_absorption_column/data/NCCC_Data.csv
    kind: packaged_reference_data
  - path: inputs/retained_reactive_case3c/film_states.csv
    kind: retained_reactive_film_states
  - path: inputs/retained_reactive_case3c/speciation_table.csv
    kind: certified_reactive_speciation_table
  - path: inputs/retained_reactive_case3c/speciation_table_summary.json
    kind: certified_reactive_speciation_identity
  - path: inputs/issue17_enhancement_comparison/historical_fugacity_only_scalar_row.csv
    kind: historical_scalar_evidence
  - path: inputs/issue17_enhancement_comparison/current_fugacity_only_reconstruction_result.csv
    kind: current_reconstruction_result
  - path: inputs/issue17_enhancement_comparison/current_fugacity_only_full_profile.csv
    kind: retained_fugacity_only_profile
  - path: inputs/issue17_enhancement_comparison/current_fugacity_only_fixed_states.csv
    kind: retained_fixed_state_sample
  - path: inputs/issue17_enhancement_comparison/identity.json
    kind: issue17_reproducibility_identity
  - path: inputs/issue16_reactive_film_identity.json
    kind: issue16_immutable_input_receipt
outputs:
  - path: results/final/tables/verified_c_case_thermo_benchmark.csv
    kind: accepted_result_table
  - path: results/final/tables/validation_evidence_registry.csv
    kind: evidence_registry
  - path: results/final/tables/primary_validation_gate.csv
    kind: validation_gate_table
  - path: results/final/tables/calibration_holdout_metrics.csv
    kind: calibration_screen_table
  - path: results/final/tables/error_regime_capture_data.csv
    kind: plot_data_table
  - path: results/final/tables/uncertainty_band_capture.csv
    kind: uncertainty_screen_table
  - path: results/final/tables/method_case_contrast.csv
    kind: solver_method_diagnostic_table
  - path: results/final/tables/source_backed_1c_6c_temperature_capture_profile_metrics.csv
    kind: source_backed_temperature_capture_profile_table
  - path: results/final/tables/epcsaft_v02_contribution_table.csv
    kind: current_epcsaft_v02_fixed_state_validation
  - path: results/final/tables/epcsaft_v02_column_row.csv
    kind: current_epcsaft_v02_fixed_chemistry_column_validation
  - path: results/final/tables/full_species_ionic_2017_c_case_sweep.csv
    kind: activity_coupled_feasibility_table
  - path: results/final/figures/c_case_thermo_benchmark.pdf
    kind: manuscript_figure
  - path: results/final/figures/error_regime_capture_error.pdf
    kind: manuscript_figure
  - path: results/final/figures/calibration_uncertainty_band.pdf
    kind: manuscript_figure
  - path: results/final/figures/method_case_solver_contrast.pdf
    kind: manuscript_figure
  - path: results/final/figures/source_backed_1c_6c_temperature_capture_profiles
    kind: source_backed_temperature_capture_gallery
  - path: results/final/tables/retained_reactive_case3c_profile_comparison.csv
    kind: reactive_profile_comparison_table
  - path: results/final/tables/retained_reactive_case3c_fugacity_factorial.csv
    kind: reactive_fugacity_factorial_table
  - path: results/final/tables/retained_reactive_case3c_sensitivity.csv
    kind: reactive_column_sensitivity_table
  - path: results/final/figures/retained_reactive_case3c_diagnosis.pdf
    kind: research_journal_figure
  - path: results/final/tables/retained_reactive_case3c_enhancement_formulations.csv
    kind: enhancement_consistency_table
  - path: results/final/tables/retained_reactive_case3c_enhancement_summary.json
    kind: enhancement_consistency_summary
  - path: results/final/tables/retained_reactive_case3c_film_runs.csv
    kind: reactive_film_acceptance_table
  - path: results/final/tables/retained_reactive_case3c_film_profile.csv
    kind: reactive_film_profile_table
  - path: results/final/tables/retained_reactive_case3c_film_summary.json
    kind: reactive_film_acceptance_summary
  - path: results/final/tables/issue16_exact_reactive_film_runs.csv
    kind: issue16_exact_derivative_attempt_table
  - path: results/final/tables/issue16_exact_reactive_film_summary.json
    kind: issue16_exact_derivative_attempt_summary
  - path: results/final/tables/issue16_exact_reactive_film_numerical_gate.csv
    kind: issue16_numerical_gate_table
  - path: results/final/tables/issue16_exact_reactive_film_numerical_gate_summary.json
    kind: issue16_numerical_gate_summary
  - path: results/final/tables/issue16_reactive_film_gate.csv
    kind: issue16_scientific_gate_table
  - path: results/final/tables/issue16_manufactured_reversible_film.csv
    kind: issue16_reversible_architecture_check
  - path: results/final/tables/retained_reactive_case3c_enhancement_film_comparison.csv
    kind: identical_state_enhancement_film_comparison
  - path: results/final/figures/retained_reactive_case3c_enhancement_consistency.pdf
    kind: enhancement_consistency_figure
  - path: results/final/tables/issue17_fugacity_only_enhancement_formulations.csv
    kind: fixed_state_enhancement_comparison
  - path: results/final/tables/issue17_fugacity_only_enhancement_aggregates.csv
    kind: fixed_state_enhancement_aggregates
  - path: results/final/tables/issue17_enhancement_stage_outcomes.csv
    kind: issue17_stage_outcomes
  - path: results/final/tables/issue17_fugacity_only_enhancement_summary.json
    kind: issue17_comparison_summary
  - path: results/final/figures/issue17_axial_enhancement.pdf
    kind: issue17_enhancement_figure
  - path: results/final/figures/issue17_axial_flux.pdf
    kind: issue17_flux_figure
  - path: results/final/figures/issue17_parity_to_gaspar_implicit.pdf
    kind: issue17_parity_figure
  - path: results/final/profiles
    kind: clean_profile_gallery
  - path: results/runs/*/profiles
    kind: requested_dense_profile_csvs
commands:
  generate:
    - uv run python analyses/nccc_validation/scripts/generate_data.py
  render:
    - uv run python analyses/nccc_validation/scripts/render_figures.py
    - uv run python analyses/nccc_validation/scripts/render_source_backed_temperature_capture_gallery.py
  profiles:
    - uv run python analyses/nccc_validation/scripts/collect_clean_profiles.py --collect-existing
  case_profile:
    - uv run python analyses/nccc_validation/scripts/run_case_profile.py --case-source C_cases_data --case-id 3C --method scipy-bvp --thermo-model ideal_henry --output-dir analyses/nccc_validation/results/runs/manual_case_profiles
  clean_profile_csvs:
    - uv run python analyses/nccc_validation/scripts/generate_clean_profile_csvs.py --suite all --output-dir analyses/nccc_validation/results/runs/clean_profile_csvs
  validate:
    - uv run python analyses/nccc_validation/scripts/validate_results.py
  epcsaft_v02_validation:
    - uv run python analyses/nccc_validation/scripts/generate_epcsaft_v02_validation.py
  retained_reactive_case3c_analysis:
    - MEA_EPCSAFT_REACTIVE_TABLE=analyses/nccc_validation/inputs/retained_reactive_case3c/speciation_table.csv uv run python analyses/nccc_validation/scripts/analyze_retained_reactive_case3c.py
    - uv run python analyses/nccc_validation/scripts/render_retained_reactive_case3c_diagnosis.py
  enhancement_consistency:
    - MEA_EPCSAFT_DATASET_NAME=MEA_CO2_H2O_retained_predictive MEA_EPCSAFT_REACTIVE_TABLE=analyses/nccc_validation/inputs/retained_reactive_case3c/speciation_table.csv uv run python analyses/nccc_validation/scripts/analyze_enhancement_consistency.py
    - uv run python analyses/nccc_validation/scripts/render_enhancement_consistency.py
    - uv run pytest -q analyses/nccc_validation/tests/test_enhancement_consistency.py
  issue17_enhancement_comparison:
    - uv run python analyses/nccc_validation/scripts/analyze_issue17_enhancement_comparison.py
    - uv run python analyses/nccc_validation/scripts/render_issue17_enhancement_comparison.py
    - uv run python analyses/nccc_validation/scripts/validate_results.py --issue17-only
  reactive_film:
    - MEA_EPCSAFT_DATASET_NAME=MEA_CO2_H2O_retained_predictive MEA_EPCSAFT_REACTIVE_TABLE=analyses/nccc_validation/inputs/retained_reactive_case3c/speciation_table.csv uv run python analyses/nccc_validation/scripts/analyze_reactive_film.py --full
    - MEA_EPCSAFT_DATASET_NAME=MEA_CO2_H2O_retained_predictive MEA_EPCSAFT_REACTIVE_TABLE=analyses/nccc_validation/inputs/retained_reactive_case3c/speciation_table.csv uv run python analyses/nccc_validation/scripts/analyze_reactive_film.py --numerical-gate
  issue16_reactive_film:
    - uv run python scripts/check_epcsaft_integration.py --mode final
    - uv run pytest -q tests/test_reactive_film.py -k exact_epcsaft_tangent_closes_through_zero_drive_film
    - MEA_EPCSAFT_DATASET_NAME=MEA_CO2_H2O_retained_predictive MEA_EPCSAFT_REACTIVE_TABLE=analyses/nccc_validation/inputs/retained_reactive_case3c/speciation_table.csv uv run python analyses/nccc_validation/scripts/analyze_reactive_film.py --full --case-timeout-s 10
    - MEA_EPCSAFT_DATASET_NAME=MEA_CO2_H2O_retained_predictive MEA_EPCSAFT_REACTIVE_TABLE=analyses/nccc_validation/inputs/retained_reactive_case3c/speciation_table.csv uv run python analyses/nccc_validation/scripts/analyze_reactive_film.py --numerical-gate --case-timeout-s 10
    - MEA_EPCSAFT_DATASET_NAME=MEA_CO2_H2O_retained_predictive MEA_EPCSAFT_REACTIVE_TABLE=analyses/nccc_validation/inputs/retained_reactive_case3c/speciation_table.csv uv run python analyses/nccc_validation/scripts/generate_issue16_evidence.py
runtime:
  quick_seconds: 10
  full_seconds: 600
external_dependencies:
  epcsaft:
    required_for:
      - thermo_model: epcsaft_ionic
      - thermo_model: epcsaft_reactive_six
      - thermo_model: epcsaft_reactive_six_concentration
      - thermo_model: epcsaft_reactive_six_activity
      - script: scripts/probe_reactive_epcsaft_speciation.py
      - script: scripts/generate_epcsaft_v02_validation.py
    not_required_for:
      - thermo_model: ideal_henry
      - script: scripts/generate_data.py
      - script: scripts/render_figures.py
      - script: scripts/validate_results.py
    package_contract: external package is read-only from this repo; adapter, caching, guards, and benchmark scripts live here
    optional_env:
      MEA_EPCSAFT_DATASET_NAME: MEA_CO2_H2O_ionic_fit
    repo_owned_datasets:
      - ../../src/mea_absorption_column/data/epcsaft_datasets/MEA_CO2_H2O_draft
      - ../../src/mea_absorption_column/data/epcsaft_datasets/MEA_CO2_H2O_ionic_fit
      - ../../src/mea_absorption_column/data/epcsaft_datasets/MEA_CO2_H2O_neutral_legacy
tracked_results:
  - results/final/tables
  - results/final/figures
  - results/final/profiles
  - results/final/tables/retained_reactive_case3c_profile_comparison.csv
  - results/final/tables/retained_reactive_case3c_fugacity_factorial.csv
  - results/final/tables/retained_reactive_case3c_sensitivity.csv
  - results/final/tables/retained_reactive_case3c_diagnosis_summary.json
  - results/final/figures/retained_reactive_case3c_diagnosis.pdf
  - results/final/tables/retained_reactive_case3c_enhancement_formulations.csv
  - results/final/tables/retained_reactive_case3c_enhancement_summary.json
  - results/final/tables/retained_reactive_case3c_film_runs.csv
  - results/final/tables/retained_reactive_case3c_film_profile.csv
  - results/final/tables/retained_reactive_case3c_film_summary.json
  - results/final/tables/issue16_exact_reactive_film_runs.csv
  - results/final/tables/issue16_exact_reactive_film_summary.json
  - results/final/tables/issue16_exact_reactive_film_numerical_gate.csv
  - results/final/tables/issue16_exact_reactive_film_numerical_gate_summary.json
  - results/final/tables/issue16_reactive_film_gate.csv
  - results/final/tables/issue16_manufactured_reversible_film.csv
  - results/final/tables/retained_reactive_case3c_enhancement_film_comparison.csv
  - results/final/figures/retained_reactive_case3c_enhancement_consistency.pdf
  - results/final/tables/issue17_fugacity_only_enhancement_formulations.csv
  - results/final/tables/issue17_fugacity_only_enhancement_aggregates.csv
  - results/final/tables/issue17_enhancement_stage_outcomes.csv
  - results/final/tables/issue17_fugacity_only_enhancement_summary.json
  - results/final/figures/issue17_axial_enhancement.pdf
  - results/final/figures/issue17_axial_flux.pdf
  - results/final/figures/issue17_parity_to_gaspar_implicit.pdf
historical_outputs:
  note: Pre-0.2 runtime-option and configuration matrices are preserved for provenance only, have no supported generator, and are not current validation evidence.
  paths:
    - results/final/tables/epcsaft_electrolyte_option_matrix.csv
    - results/final/reports/epcsaft_electrolyte_option_matrix.md
    - results/final/tables/epcsaft_electrolyte_column_config_matrix.csv
    - results/final/tables/epcsaft_electrolyte_config_user_options.csv
    - results/final/tables/epcsaft_electrolyte_pure_parameters.csv
    - results/final/tables/epcsaft_electrolyte_binary_parameters.csv
    - results/final/tables/epcsaft_electrolyte_relative_permittivity_parameters.csv
    - results/final/reports/epcsaft_electrolyte_column_config_matrix.md
