# One editable absorber request; preview never runs a column.
preset = "seven_state_legacy"

[case]
source = "C_cases_data"
id = "3C"
data_type = "mole"
vapor_composition_mode = "legacy_ratio"
gas_flow_basis = "reported_total_wet"

[model]
thermo_model = "ideal_henry"
film_model = "enhancement_factor"

[model.parameters]
staged_beds = false
enhancement_type = "explicit"

[numerics]
method = "scipy-bvp"

[numerics.solver_settings]
mesh_points = 21
tol = 0.5
bc_tol = 0.001
max_nodes = 1000
thermal_state_mode = "enthalpy"
transform_mode = "raw"
jacobian_mode = "numerical"
profile_csvs = true
profile_pngs = false

[execution]
output_dir = "analyses/research_options/results/runs/henry_3c"
process_isolation = true
wall_limit_s = 120.0
