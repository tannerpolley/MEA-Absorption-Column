version = 1
name = "MEA-Absorption-Column"

[setup]
script = '''
$ErrorActionPreference = "Stop"
Set-StrictMode -Version Latest

$repoRoot = (git rev-parse --show-toplevel).Trim()
Set-Location $repoRoot

if (-not (Get-Command uv -ErrorAction SilentlyContinue)) {
    throw "uv is required for MEA-Absorption-Column worktree setup."
}

uv sync --group test

$epcsaftRoot = "C:\Users\Tanner\Documents\git\ePC-SAFT"
if (Test-Path -LiteralPath $epcsaftRoot) {
    uv pip install $epcsaftRoot
} else {
    Write-Warning "Sibling ePC-SAFT checkout not found at $epcsaftRoot; ePC-SAFT lanes may be unavailable."
}
'''

[[actions]]
name = "Sync Environment"
icon = "download"
command = "uv sync --group test"
platform = "win32"

[[actions]]
name = "Install ePC-SAFT"
icon = "download"
command = "uv pip install C:\\Users\\Tanner\\Documents\\git\\ePC-SAFT"
platform = "win32"

[[actions]]
name = "Test Quick"
icon = "test"
command = ".\\.venv\\Scripts\\python.exe -m pytest -q -p no:cacheprovider tests\\test_benchmarking.py tests\\test_transport_domain_guards.py"
platform = "win32"

[[actions]]
name = "Test ePC-SAFT"
icon = "test"
command = ".\\.venv\\Scripts\\python.exe -m pytest -q -p no:cacheprovider tests\\test_thermodynamics_adapter.py -k \"epcsaft or ionic\""
platform = "win32"

[[actions]]
name = "Validate Artifacts"
icon = "inspect"
command = ".\\.venv\\Scripts\\python.exe analyses\\nccc_validation\\scripts\\validate_results.py"
platform = "win32"

[[actions]]
name = "Build LaTeX"
icon = "document"
command = "pwsh -NoProfile -ExecutionPolicy Bypass -File docs\\latex\\scripts\\build_main.ps1"
platform = "win32"

[[actions]]
name = "Check LaTeX Freshness"
icon = "inspect"
command = ".\\.venv\\Scripts\\python.exe docs\\latex\\scripts\\check_main_pdf_fresh.py"
platform = "win32"
